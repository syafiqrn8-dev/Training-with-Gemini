<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penghitung Digital Keren</title>
    <link rel="stylesheet" href="CSS/AngkaCounter.css" />
  </head>
  <body>
    <div class="card">
      <h2>PENGHITUNG DIGITAL</h2>

      <div class="counter-display">
        <span id="angkaCounter">0</span>
      </div>

      <p>Klik tombol di bawah untuk menambah angka</p>

      <button id="tombolAksi">+</button>
      <button id="tombolAksiMinus">-</button>
    </div>

    <script src="JS/AngkaCounter.js"></script>
  </body>
</html>
